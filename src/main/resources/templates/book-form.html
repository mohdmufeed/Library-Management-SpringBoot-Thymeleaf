<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book - Library Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .form-header {
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            padding: 2rem 2.5rem 1.5rem;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: #e0e7ff;
            color: var(--primary-color);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .form-body {
            padding: 2rem 2.5rem 2.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #94a3b8;
            border-radius: 10px 0 0 10px;
            padding-left: 1.25rem;
            padding-right: 1rem;
        }

        .form-control {
            border-color: #e2e8f0;
            background-color: #f8fafc;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: #1e293b;
            border-radius: 0 10px 10px 0;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Fix rounded corners when validation error strikes */
        .form-control.is-invalid {
            border-color: #ef4444;
            background-image: none;
        }

        .form-control.is-invalid:focus {
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .invalid-feedback-custom {
            font-size: 0.8rem;
            font-weight: 500;
            color: #ef4444;
            margin-top: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-submit {
            background-color: var(--primary-color);
            border: none;
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        .btn-cancel {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #64748b;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            color: #334155;
        }
    </style>
</head>

<body>

<!-- Top Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/books/}">
            <i class="fa-solid me-1 fa-book-open text-primary"></i>
            <span>Library Dashboard</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm rounded-pill px-3" th:href="@{/books/list}">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Books
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7">

            <div class="card form-card">

                <!-- Header Section -->
                <div class="form-header d-flex align-items-center gap-3">
                    <div class="header-icon">
                        <i class="fa-solid fa-book-medical"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark m-0">Book Details</h4>
                        <p class="text-muted small m-0">Fill in the information below to update or create a book record</p>
                    </div>
                </div>

                <!-- Form Section -->
                <div class="form-body">
                    <form method="POST"
                          th:object="${book}"
                          th:action="@{/books/saveBook}">

                        <!-- Hidden ID Field -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Book Title -->
                        <div class="mb-3.5 mb-3">
                            <label class="form-label">Book Title</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-book"></i></span>
                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       type="text"
                                       th:field="*{title}"
                                       placeholder="e.g. The Great Gatsby">
                            </div>
                            <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('title')}">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <span th:errors="*{title}"></span>
                            </div>
                        </div>

                        <!-- Author & Category Row -->
                        <div class="row g-3 mb-3">
                            <!-- Author -->
                            <div class="col-md-6">
                                <label class="form-label">Author Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-user-pen"></i></span>
                                    <input class="form-control"
                                           th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'"
                                           type="text"
                                           th:field="*{author}"
                                           placeholder="e.g. F. Scott Fitzgerald">
                                </div>
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('author')}">
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span th:errors="*{author}"></span>
                                </div>
                            </div>

                            <!-- Category -->
                            <div class="col-md-6">
                                <label class="form-label">Category</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-tags"></i></span>
                                    <input class="form-control"
                                           th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'"
                                           type="text"
                                           th:field="*{category}"
                                           placeholder="e.g. Fiction, History">
                                </div>
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('category')}">
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span th:errors="*{category}"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Quantity & Price Row -->
                        <div class="row g-3 mb-4">
                            <!-- Quantity -->
                            <div class="col-md-6">
                                <label class="form-label">Quantity in Stock</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-boxes-stacked"></i></span>
                                    <input class="form-control"
                                           th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                                           type="number"
                                           th:field="*{quantity}"
                                           placeholder="e.g. 10">
                                </div>
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('quantity')}">
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span th:errors="*{quantity}"></span>
                                </div>
                            </div>

                            <!-- Price -->
                            <div class="col-md-6">
                                <label class="form-label">Price ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-dollar-sign"></i></span>
                                    <input class="form-control"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                           type="number"
                                           step="0.01"
                                           th:field="*{price}"
                                           placeholder="e.g. 19.99">
                                </div>
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('price')}">
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span th:errors="*{price}"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex align-items-center justify-content-between pt-2">
                            <a th:href="@{/books/list}" class="btn btn-cancel">
                                <i class="fa-solid fa-xmark me-1"></i> Cancel
                            </a>

                            <button type="submit" class="btn btn-submit">
                                <i class="fa-solid fa-floppy-disk me-1.5"></i> Save Book
                            </button>
                        </div>

                    </form>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

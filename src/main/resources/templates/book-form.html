<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add New Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-dark text-white text-center">
                    <h3 class="mb-0">📚 Add New Book</h3>
                </div>

                <div class="card-body">

                    <form method="POST"
                          th:object="${book}"
                          th:action="@{/books/saveBook}">


                        <div class="mb-3">
                            <input type="hidden" th:field="*{id}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input class="form-control "
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   type="text"
                                   th:field="*{title}"
                                   placeholder="Enter book title">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input class="form-control "
                                   th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'"
                                   type="text"
                                   th:field="*{author}"
                                   placeholder="Enter author name">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('author')}"
                                 th:errors="*{author}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input class="form-control"
                                   th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'"
                                   type="text"
                                   th:field="*{category}"
                                   placeholder="Enter category">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('category')}"
                                 th:errors="*{category}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input class="form-control"
                                   th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                                   type="number"
                                   th:field="*{quantity}"
                                   placeholder="Enter quantity">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('quantity')}"
                                 th:errors="*{quantity}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Price</label>
                            <input class="form-control "
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                   type="number"
                                   step="0.01"
                                   th:field="*{price}"
                                   placeholder="Enter price">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('price')}"
                                 th:errors="*{price}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/books/list}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-success">
                                💾 Save Book
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

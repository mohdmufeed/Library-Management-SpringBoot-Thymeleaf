<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-surface: #f8fafc;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .main-card {
            background: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .search-input {
            border-radius: 10px 0 0 10px !important;
            border: 1px solid #e2e8f0;
            padding-left: 1rem;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-btn {
            border-radius: 0 10px 10px 0 !important;
            background-color: var(--primary-color);
            border: none;
        }

        .search-btn:hover {
            background-color: var(--primary-hover);
        }

        .custom-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        .custom-table thead th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1rem 1.25rem;
            border-bottom: 2px solid #e2e8f0;
        }

        /* Fixed row flickering by using background color shift instead of transform scale */
        .custom-table tbody tr {
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .custom-table tbody tr:hover {
            background-color: #f1f5f9;
        }

        .custom-table tbody td {
            padding: 1rem 1.25rem;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
        }

        .btn-custom-action {
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background-color: #e0e7ff;
            color: var(--primary-color);
            border: none;
        }

        .btn-edit:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
        }

        .btn-delete:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        .badge-category {
            background-color: #e2e8f0;
            color: #334155;
            font-weight: 600;
            padding: 0.35em 0.8em;
            border-radius: 6px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<!-- Top Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/books/}">
            <i class="fa-solid me-1 fa-book-open text-primary"></i>
            <span>Library Dashboard</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm rounded-pill px-3" th:href="@{/books/}">
                <i class="fa-solid fa-house me-1"></i> Home
            </a>
            <a class="btn btn-primary btn-sm rounded-pill px-3"
               sec:authorize="hasRole('LIBRARIAN')"
               th:href="@{/books/showFormForAdd}">
                <i class="fa-solid fa-plus me-1"></i> Add Book
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- Flash Alert Message -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Main Card Section -->
    <div class="card main-card p-4">

        <!-- Controls Bar: Title, Search & Reset -->
        <div class="row align-items-center g-3 mb-4">
            <div class="col-md-4">
                <h4 class="m-0 fw-bold text-dark">Book Collection</h4>
                <p class="text-muted small m-0">Manage and browse your entire library index</p>
            </div>

            <div class="col-md-8">
                <div class="d-flex flex-wrap justify-content-md-end align-items-center gap-2">

                    <!-- Search Form -->
                    <form th:action="@{/books/search}" method="get" class="flex-grow-1 flex-md-grow-0">
                        <div class="input-group">
                            <input type="search" name="query" class="form-control search-input" placeholder="Search by title..." th:value="${query}">
                            <button type="submit" class="btn btn-primary search-btn px-3">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Show All Button -->
                    <a class="btn btn-outline-secondary rounded-3" th:href="@{/books/list}">
                        <i class="fa-solid fa-rotate me-1"></i> Show All
                    </a>
                </div>
            </div>
        </div>

        <!-- Empty State Alert -->
        <div class="alert alert-warning border-0 rounded-3 shadow-sm text-center py-4 my-3" th:if="${#lists.isEmpty(books)}">
            <i class="fa-solid fa-box-open fa-2x mb-2 text-warning"></i>
            <h5 class="fw-semibold">No Books Found</h5>
            <p class="mb-0 text-muted" th:if="${query}">No record matches "<span class="fw-bold" th:text="${query}"></span>"</p>
            <p class="mb-0 text-muted" th:unless="${query}">There are currently no books available in the inventory.</p>
        </div>

        <!-- Books Table -->
        <div class="table-responsive" th:if="${!#lists.isEmpty(books)}">
            <table class="table custom-table align-middle">
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Category</th>
                    <th scope="col" class="text-center">Quantity</th>
                    <th scope="col">Price</th>
                    <th scope="col"
                        class="text-end"
                        sec:authorize="hasAnyRole('LIBRARIAN', 'ADMIN')">
                        Actions
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td class="fw-bold text-secondary" th:text="${'#' + book.id}"></td>
                    <td>
                        <div class="fw-semibold text-dark" th:text="${book.title}"></div>
                    </td>
                    <td class="text-secondary" th:text="${book.author}"></td>
                    <td>
                        <span class="badge badge-category" th:text="${book.category}"></span>
                    </td>
                    <td class="text-center">
                        <span class="badge rounded-pill bg-light text-dark border px-3" th:text="${book.quantity}"></span>
                    </td>
                    <td class="fw-bold text-success" th:text="${'$' + book.price}"></td>
                    <td class="text-end" sec:authorize="hasAnyRole('LIBRARIAN', 'ADMIN')">
                        <div class="d-inline-flex gap-2">
                            <a class="btn btn-custom-action btn-edit"
                               sec:authorize="hasRole('LIBRARIAN')"
                               th:href="@{/books/showFormForUpdate(id=${book.id})}">
                                <i class="fa-solid fa-pen-to-square me-1"></i> Edit
                            </a>
                            <a class="btn btn-custom-action btn-delete"
                               sec:authorize="hasRole('ADMIN')"
                               th:href="@{/books/delete(id=${book.id})}"
                               onclick="return confirm('Are you sure you want to delete this book?')">
                                <i class="fa-solid fa-trash me-1"></i> Delete
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:if="${success}" th:inline="javascript">
    Swal.fire({
        toast: true,
        position: 'top',
        icon: 'success',
        title: [[${success}]],
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        background: '#ffffff',
        iconColor: '#10b981'
    });
</script>
</body>
</html>

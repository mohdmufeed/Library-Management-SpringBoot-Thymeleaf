<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            transition: transform 0.3s ease;
        }

        .brand-header {
            background: rgba(79, 70, 229, 0.05);
            border-bottom: 1px solid #f1f5f9;
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #e0e7ff;
            color: var(--primary-color);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        .form-container {
            padding: 2rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #94a3b8;
            border-radius: 10px 0 0 10px;
            padding-left: 1.25rem;
            padding-right: 1rem;
        }

        .form-control {
            border-color: #e2e8f0;
            background-color: #f8fafc;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: #1e293b;
            border-radius: 0 10px 10px 0;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .password-field .form-control {
            border-radius: 0;
        }

        .password-toggle {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: none;
            color: #94a3b8;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #475569;
        }

        .btn-primary-custom {
            background-color: var(--primary-color);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        .alert-custom {
            border: none;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.85rem 1rem;
        }
    </style>
</head>

<body>

<div class="login-card">

    <!-- Header / Branding -->
    <div class="brand-header">
        <div class="brand-icon">
            <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <h3 class="fw-bold text-dark m-0">Library Portal</h3>
        <p class="text-muted small m-0 mt-1">Sign in to access your dashboard</p>
    </div>

    <!-- Form Section -->
    <div class="form-container">

        <!-- Error Message -->
        <div class="alert alert-danger alert-custom d-flex align-items-center mb-3"
             role="alert"
             th:if="${param.error}">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <div>Invalid username or password!</div>
        </div>

        <!-- Logout Message -->
        <div id="logoutMessage"
             class="alert alert-success alert-custom d-flex align-items-center mb-3"
             role="alert"
             th:if="${param.logout}">
            <i class="fa-solid fa-circle-check me-2"></i>
            <div>You have been logged out successfully.</div>
        </div>

        <form th:action="@{/authenticateTheUser}" method="post">

            <!-- Username Field -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input
                            type="text"
                            class="form-control"
                            name="username"
                            placeholder="Enter your username"
                            required
                            autofocus>
                </div>
            </div>

            <!-- Password Field -->
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group password-field">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input
                            type="password"
                            id="passwordInput"
                            class="form-control"
                            name="password"
                            placeholder="Enter your password"
                            required>
                    <button class="btn password-toggle" type="button" id="togglePasswordBtn">
                        <i class="fa-solid fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
                <button
                        type="submit"
                        class="btn btn-primary btn-primary-custom">
                    Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                </button>
            </div>

        </form>

    </div>

</div>

<!-- Interactive UI Scripts -->
<script>
    // Fade out logout message
    setTimeout(function () {
        const message = document.getElementById("logoutMessage");
        if (message) {
            message.style.transition = "opacity 0.5s ease";
            message.style.opacity = "0";
            setTimeout(() => {
                message.remove();
            }, 500);
        }
    }, 2500);

    // Password visibility toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('passwordInput');
    const toggleIcon = document.getElementById('toggleIcon');

    if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.classList.toggle('fa-eye');
            toggleIcon.classList.toggle('fa-eye-slash');
        });
    }
</script>

</body>
</html>
